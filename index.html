<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5cab"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Annual Leave</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:680px;margin:auto}.card{background:#fff;border:1px solid #dfe3e8;border-radius:18px;margin:14px 0;overflow:hidden}.pad{padding:18px}.center{text-align:center}.muted{color:#68727d;font-size:13px}.balance{font-size:42px;font-weight:800;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #e3e6e9}.stat{padding:13px 5px;text-align:center;border-right:1px solid #e3e6e9}.stat:last-child{border:0}.stat b{display:block;margin-top:4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;margin-bottom:5px}input,select,button{width:100%;font:inherit;border-radius:12px;border:1px solid #cfd5db;background:#fff;padding:12px;min-height:46px}button.primary{background:#0b5cab;color:#fff;border:0;font-weight:700}.historyButton{border:0;text-align:left;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:17px}.entry{border-top:1px solid #e6e9ec;padding:14px}.entryTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.entry select{width:auto;min-width:112px;padding:8px}.remove{margin-top:10px;padding:9px;min-height:40px}.hidden{display:none}h2{font-size:19px;margin:0 0 14px}.msg{font-size:13px;color:#68727d;min-height:18px;margin:8px 0}@media(max-width:390px){.balance{font-size:38px}.row{grid-template-columns:1fr}.stats{font-size:14px}}</style></head><body>
<div class="card"><div class="pad center"><div class="muted">1 Apr 2026 – 31 Mar 2027</div><div>Annual leave remaining</div><div id="remaining" class="balance"></div><div class="muted">of 318.40 hrs entitlement</div></div><div class="stats"><div class="stat"><span class="muted">Taken</span><b id="taken"></b></div><div class="stat"><span class="muted">Planned</span><b id="planned"></b></div><div class="stat"><span class="muted">Requested</span><b id="requested"></b></div></div></div>
<div class="card pad"><h2>Add annual leave</h2><form id="form"><div class="row"><div><label>Start date</label><input id="start" type="date" required></div><div><label>End date</label><input id="end" type="date" required></div></div><div style="margin-top:10px"><label>Description (optional)</label><input id="desc" maxlength="80"></div><div class="row" style="margin-top:10px"><div><label>Hours</label><input id="hours" type="number" step="0.25" min="0.01" inputmode="decimal" required></div><div><label>Status</label><select id="status"><option value="requested">Requested</option><option value="planned">Planned</option><option value="taken">Taken</option></select></div></div><div id="msg" class="msg"></div><button class="primary" type="submit">Add leave</button></form></div>
<div class="card"><button id="historyToggle" class="historyButton"><span><b>Leave history</b><br><span id="historySummary" class="muted"></span></span><span id="arrow">＋</span></button><div id="history" class="hidden"><div class="pad" style="padding-bottom:8px"><select id="filter"><option value="active">Current leave</option><option value="all">Include cancelled</option><option value="taken">Taken</option><option value="planned">Planned</option><option value="requested">Requested</option></select></div><div id="list"></div></div></div>
<div class="muted center" style="padding:4px 12px 22px">Planned leave automatically becomes Taken after its scheduled end date. Your changes are stored on this device.</div>
<script>
const ENT=318.4, KEY='annualLeaveTracker_v1';
const seed=[{id:1,s:'2026-06-03',e:'2026-06-03',h:9.5,st:'taken'},{id:2,s:'2026-06-04',e:'2026-06-04',h:0,st:'cancelled'},{id:3,s:'2026-06-04',e:'2026-06-04',h:9.5,st:'taken'},{id:4,s:'2026-06-08',e:'2026-06-08',h:9.5,st:'taken'},{id:5,s:'2026-06-19',e:'2026-06-19',h:9.5,st:'taken'},{id:6,s:'2026-07-10',e:'2026-07-10',h:9.5,st:'taken'},{id:7,s:'2026-07-16',e:'2026-07-19',h:37.5,st:'taken'},{id:8,s:'2026-08-17',e:'2026-08-17',h:0,st:'cancelled'},{id:9,s:'2026-09-07',e:'2026-09-10',h:38,st:'taken'},{id:10,s:'2026-09-14',e:'2026-09-14',h:9.5,st:'taken'},{id:11,s:'2026-09-25',e:'2026-09-25',h:9.5,st:'planned'},{id:12,s:'2026-10-05',e:'2026-10-06',h:19,st:'planned'},{id:13,s:'2026-11-09',e:'2026-11-15',h:37.5,st:'planned'},{id:14,s:'2026-11-17',e:'2026-11-20',h:36,st:'planned'},{id:15,s:'2026-11-23',e:'2026-11-26',h:0,st:'cancelled'},{id:16,s:'2026-12-23',e:'2026-12-23',h:9.5,st:'requested'},{id:17,s:'2027-01-22',e:'2027-01-22',h:9.5,st:'requested'},{id:18,s:'2027-01-25',e:'2027-01-31',h:37.5,st:'planned'}];
let entries;try{entries=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){entries=seed}const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(entries));const today=()=>{let n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`};const eff=x=>x.st==='planned'&&x.e<today()?'taken':x.st;const fmt=n=>(Math.round(n*100)/100).toFixed(2);const pretty=s=>new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(s+'T00:00:00Z'));
function render(){const sum=st=>entries.filter(x=>eff(x)===st).reduce((a,x)=>a+x.h,0),t=sum('taken'),p=sum('planned'),q=sum('requested');$('taken').textContent=fmt(t)+' hrs';$('planned').textContent=fmt(p)+' hrs';$('requested').textContent=fmt(q)+' hrs';$('remaining').textContent=fmt(ENT-t-p-q)+' hrs';$('historySummary').textContent=entries.filter(x=>eff(x)!=='cancelled').length+' active entries · tap to view';let f=$('filter').value, rows=entries.filter(x=>f==='all'||(f==='active'?eff(x)!=='cancelled':eff(x)===f)).sort((a,b)=>a.s.localeCompare(b.s));$('list').innerHTML='';rows.forEach(x=>{let d=document.createElement('div');d.className='entry';let top=document.createElement('div');top.className='entryTop';let info=document.createElement('div');let title=document.createElement('b');title.textContent=x.d||'Annual Leave';let meta=document.createElement('div');meta.className='muted';meta.style.marginTop='5px';meta.textContent=pretty(x.s)+(x.e!==x.s?' – '+pretty(x.e):'')+' · '+fmt(x.h)+' hrs';info.append(title,meta);let sel=document.createElement('select');[['taken','Taken'],['planned','Planned'],['requested','Requested'],['cancelled','Cancelled']].forEach(([v,l])=>{let o=document.createElement('option');o.value=v;o.textContent=l;o.selected=eff(x)===v;sel.append(o)});sel.onchange=()=>{x.st=sel.value;if(sel.value==='cancelled')x.h=0;save();render()};top.append(info,sel);let del=document.createElement('button');del.className='remove';del.textContent='Remove entry';del.onclick=()=>{entries=entries.filter(e=>e.id!==x.id);save();render()};d.append(top,del);$('list').append(d)});save()}
$('historyToggle').onclick=()=>{let h=$('history');h.classList.toggle('hidden');$('arrow').textContent=h.classList.contains('hidden')?'＋':'−'};$('filter').onchange=render;$('start').onchange=()=>{if(!$('end').value)$('end').value=$('start').value};$('form').onsubmit=e=>{e.preventDefault();let h=Number($('hours').value),s=$('start').value,en=$('end').value;if(en<s){$('msg').textContent='End date cannot be before start date.';return}entries.push({id:Date.now(),s,e:en,h,st:$('status').value,d:$('desc').value.trim()});save();$('hours').value='';$('desc').value='';$('msg').textContent='Annual leave added.';render()};render();setInterval(render,60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
